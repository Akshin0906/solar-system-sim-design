    <style>
      #prehydrate-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #090907;
        color: rgba(245, 241, 232, 0.74);
        font:

          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "SF Pro Text",
          sans-serif;
      }

      #prehydrate-splash span {
        display: grid;
        gap: 10px;
        min-width: 128px;
        text-align: center;
      }

      #prehydrate-splash span::before {
        width: 128px;
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgba(217, 173, 105, 0.72), transparent);
        content: "";
