name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # Pull requests isolate their checks by ref. Every deploy-capable run shares one
  # queue because GitHub Pages is a single environment, regardless of trigger.
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency tree
        run: npm audit --audit-level=high

      - name: Lint source and tests
        run: npm run lint

      - name: Verify orbital math
        run: npm run verify:math

      - name: Verify app logic, rockets, and scripts types
        run: npm test

      - name: Build Pages artifact
        run: npm run build:github

      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit

      - name: Test the Pages artifact in browsers
        run: npm run test:e2e
        env:
          PLAYWRIGHT_APP_PATH: /solar-system-sim-design/
          PLAYWRIGHT_PREBUILT: "1"

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Setup Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify deployed site responds
        run: |
          deployment_url="${{ steps.deployment.outputs.page_url }}"
          deployment_root="${deployment_url%/}"
          page_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors \
            --max-time 30 --output "$page_file" \
            "$deployment_root/"
          grep --quiet '/solar-system-sim-design/assets/' "$page_file"
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors \
            --max-time 30 --output /dev/null \
            "$deployment_root/manifest.webmanifest"
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors \
            --max-time 30 --output /dev/null \
            "$deployment_root/service-worker.js"
