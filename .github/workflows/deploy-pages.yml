name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  # Pull requests isolate their checks by ref. Every deploy-capable run shares one
  # group because GitHub Pages is a single environment. A newer run cancels an older
  # run, and the explicit remote-main freshness gate rejects out-of-order stale SHAs.
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    outputs:
      deployable: ${{ steps.freshness.outputs.deployable }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency tree
        run: npm audit --audit-level=high

      - name: Lint source and tests
        run: npm run lint

      - name: Verify performance budgets
        run: npm run verify:performance

      - name: Verify orbital math
        run: npm run verify:math

      - name: Verify app logic, rockets, and scripts types
        run: npm test

      - name: Build Pages artifact
        run: npm run build:github
        env:
          VITE_BUILD_SHA: ${{ github.sha }}
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
          BUILD_REPOSITORY: ${{ github.repository }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_DIRTY: "false"

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test the Pages artifact in browsers
        run: npm run test:e2e
        env:
          PLAYWRIGHT_APP_PATH: /solar-system-sim-design/
          PLAYWRIGHT_PREBUILT: "1"

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Confirm this commit is still main
        id: freshness
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          current_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [[ -z "$current_main" ]]; then
            echo "::error::Could not resolve refs/heads/main from origin."
            exit 1
          fi

          if [[ "$current_main" == "$GITHUB_SHA" ]]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            echo "This artifact matches current main at $GITHUB_SHA."
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale artifact $GITHUB_SHA; current main is $current_main."
          fi

      - name: Setup Pages
        if: steps.freshness.outputs.deployable == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: steps.freshness.outputs.deployable == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      needs.build.outputs.deployable == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Confirm artifact commit is still main
        id: final_freshness
        shell: bash
        env:
          API_URL: ${{ github.api_url }}
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --output "$response_file" \
            "$API_URL/repos/$REPOSITORY/git/ref/heads/main"

          current_main="$(
            node --input-type=module -e '
              import { readFileSync } from "node:fs";
              const payload = JSON.parse(readFileSync(process.argv[1], "utf8"));
              const sha = payload?.object?.sha;
              if (typeof sha !== "string" || !/^[0-9a-f]{40}$/i.test(sha)) {
                throw new Error("GitHub API response did not contain a full commit SHA.");
              }
              process.stdout.write(sha.toLowerCase());
            ' "$response_file"
          )"

          if [[ "$current_main" == "${EXPECTED_SHA,,}" ]]; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            echo "Artifact $EXPECTED_SHA still matches current main."
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale artifact $EXPECTED_SHA; current main is $current_main."
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.final_freshness.outputs.deployable == 'true'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify deployed site responds
        if: steps.final_freshness.outputs.deployable == 'true'
        run: |
          deployment_url="${{ steps.deployment.outputs.page_url }}"
          deployment_root="${deployment_url%/}"
          page_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors \
            --max-time 30 --output "$page_file" \
            "$deployment_root/"
          grep --quiet '/solar-system-sim-design/assets/' "$page_file"
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors \
            --max-time 30 --output /dev/null \
            "$deployment_root/manifest.webmanifest"
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors \
            --max-time 30 --output /dev/null \
            "$deployment_root/service-worker.js"
          build_info_file="$(mktemp)"
          curl --fail --silent --show-error --location \
            --retry 8 --retry-delay 5 --retry-all-errors \
            --max-time 30 --output "$build_info_file" \
            "$deployment_root/build-info.json?commit=$GITHUB_SHA&run=$GITHUB_RUN_ID"
          grep --fixed-strings --quiet "\"commit\": \"$GITHUB_SHA\"" "$build_info_file"
          grep --fixed-strings --quiet \
            "\"workflowRun\": \"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"" \
            "$build_info_file"
          grep --fixed-strings --quiet "\"runAttempt\": \"$GITHUB_RUN_ATTEMPT\"" "$build_info_file"
          grep --fixed-strings --quiet "\"repository\": \"$GITHUB_REPOSITORY\"" "$build_info_file"
          grep --fixed-strings --quiet "\"ref\": \"$GITHUB_REF\"" "$build_info_file"
          grep --fixed-strings --quiet '"dirty": false' "$build_info_file"
